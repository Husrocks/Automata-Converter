<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ε-NFA → DFA | Automata Visualizer Pro</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
</head>
<body>
  <div id="site-header-container"></div>
  <main>
    <section class="glass" style="max-width: 900px; margin: 2rem auto; padding: 2rem;">
      <h1 class="gradient" style="font-size:2rem; font-weight:bold;">ε-NFA → DFA Converter</h1>
      <p>Build your ε-NFA visually, then see the DFA and step-by-step conversion.</p>
      <div class="builder-controls" style="margin: 2rem 0; display: flex; gap: 1rem; flex-wrap: wrap;">
        <button id="add-state" class="btn-primary">+ Add State</button>
        <button id="add-transition" class="btn-secondary">→ Add Transition</button>
        <button id="add-epsilon" class="btn-info">ε Add ε-Transition</button>
        <button id="set-initial" class="btn-info">Set Initial</button>
        <button id="set-final" class="btn-success">Set Final</button>
        <button id="reset-enfa" class="btn-danger">Reset</button>
        <button id="fit-all-view" class="btn-info">Fit All Graphs</button>
      </div>
      <div class="canvas-container glass" style="margin-bottom:2rem;">
        <div id="enfa-graph-vis" style="width:100%;height:340px;"></div>
      </div>
      <div style="text-align:right;">
        <button id="convert-btn" class="btn-primary">Convert to DFA</button>
      </div>
      <div class="canvas-container glass" style="margin-top:2rem;">
        <div id="dfa-graph-vis" style="width:100%;height:340px;"></div>
      </div>
      <div id="step-by-step" class="glass" style="margin-top:2rem; padding:1rem;">
        <h2 style="font-size:1.2rem;">Step-by-Step Explanation</h2>
        <div id="steps-content"></div>
      </div>
      <div id="solved-examples" class="glass" style="margin-top:2rem; padding:1rem;">
        <h2 style="font-size:1.2rem;">Solved Examples</h2>
        <div id="examples-content"></div>
      </div>
    </section>
  </main>
  <div id="site-footer-container"></div>
  <!-- Move scripts here to ensure DOM is loaded first -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="js/graph-renderer.js"></script>
  <script src="js/solved-examples.js"></script>
  <script src="js/visual-builder.js"></script>
  <script src="js/enfa-builder.js"></script>
  <script src="js/enfa-to-nfa.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const examplesDiv = document.getElementById('examples-content');
      if (!examplesDiv || !window.solvedExamples) return;
      // Only show ENFA→DFA examples
      const examples = window.solvedExamples.filter(ex => ex.enfa && ex.dfa);
      if (examples.length === 0) {
        examplesDiv.innerHTML = '<div style="color:#888">No solved examples available.</div>';
        return;
      }
      examplesDiv.innerHTML = examples.map((ex, i) =>
        `<button class="btn-secondary example-btn" data-idx="${i}">${ex.title}</button>`
      ).join(' ');
      examplesDiv.querySelectorAll('.example-btn').forEach(btn => {
        btn.onclick = () => {
          const idx = btn.getAttribute('data-idx');
          const ex = examples[idx];
          // Render ENFA as NFA graph (if possible)
          if (ex.enfa) {
            try {
              new VisGraphRenderer('enfa-graph-vis').renderAutomaton(ex.enfa, 'enfa');
            } catch (e) {
              document.getElementById('enfa-graph-vis').innerHTML = '<div style="color:red">Cannot render ε-NFA as graph.</div>';
            }
          } else {
            document.getElementById('enfa-graph-vis').innerHTML = '<div style="color:#888">No ε-NFA to display.</div>';
          }
          // Show DFA as formatted, centered text/graph
          if (ex.dfa) {
            try {
              new VisGraphRenderer('dfa-graph-vis').renderAutomaton(ex.dfa, 'dfa');
            } catch (e) {
              document.getElementById('dfa-graph-vis').innerHTML = '<div style="color:red">Cannot render DFA as graph.</div>';
            }
          } else {
            document.getElementById('dfa-graph-vis').innerHTML = '<div style="color:#888">No DFA to display.</div>';
          }
          document.getElementById('steps-content').innerHTML = ex.steps.map(s => `<div class='step'>${s}</div>`).join('');
        };
      });
    });
  </script>
</body>
</html>
